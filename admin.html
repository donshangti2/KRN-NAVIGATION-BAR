<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Panel</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    background: #07152f;

    color: white;

    font-family: Arial, sans-serif;

}


.kulzzy-panel {

    width: 100%;

    max-width: 900px;

    margin: auto;

}


.panel-header {

    background: #0d2145;

    border: 1px solid #d4af37;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

}


.panel-header h1 {

    margin: 0;

    color: #ffd700;

    font-size: 24px;

}


.panel-header p {

    margin-bottom: 0;

    color: #d9d9d9;

}


.login-box,
.editor-box {

    background: #0d2145;

    border: 1px solid rgba(255,215,0,0.4);

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

}


label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #ffd700;

}


input,
textarea,
select {

    width: 100%;

    border: 1px solid #405577;

    border-radius: 10px;

    background: #06132c;

    color: white;

    padding: 13px;

    font-family: Arial, sans-serif;

    outline: none;

}


input:focus,
textarea:focus,
select:focus {

    border-color: #ffd700;

}


textarea {

    min-height: 350px;

    resize: vertical;

    font-family: monospace;

    font-size: 13px;

    line-height: 1.5;

}


.field {

    margin-bottom: 18px;

}


button {

    border: none;

    border-radius: 10px;

    padding: 13px 18px;

    font-weight: bold;

    cursor: pointer;

}


.login-button,
.publish-button {

    background: #ffd700;

    color: #07152f;

}


.logout-button {

    background: #b00020;

    color: white;

}


.preview-button {

    background: #31598f;

    color: white;

}


.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}


.status {

    padding: 12px;

    border-radius: 10px;

    background: #06132c;

    margin-top: 15px;

    font-size: 14px;

}


#editorArea {

    display: none;

}


.preview {

    margin-top: 20px;

    border: 1px solid rgba(255,215,0,0.3);

    border-radius: 12px;

    overflow: hidden;

}


.preview-title {

    background: #06132c;

    padding: 12px;

    color: #ffd700;

    font-weight: bold;

}


#previewFrame {

    width: 100%;

    min-height: 400px;

    border: 0;

    background: white;

}


.logged-in {

    color: #7cff9b;

    font-weight: bold;

}


@media(max-width:600px) {

    body {

        padding: 10px;

    }

    .panel-header h1 {

        font-size: 20px;

    }

    textarea {

        min-height: 280px;

    }

}

</style>

</head>


<body>


<div class="kulzzy-panel">


    <div class="panel-header">

        <h1>
            🎙️ KULZZY PANEL
        </h1>

        <p>
            Manage Home, Request, Wishes,
            Market and More from one place.
        </p>

    </div>



    <!-- LOGIN -->

    <div
        class="login-box"
        id="loginBox">

        <h2>
            🔐 Admin Login
        </h2>


        <div class="field">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Your Firebase admin email">

        </div>


        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Your password">

        </div>


        <button
            class="login-button"
            onclick="login()">

            LOGIN

        </button>


        <div
            class="status"
            id="loginStatus">

            Please login.

        </div>

    </div>



    <!-- EDITOR -->

    <div
        class="editor-box"
        id="editorArea">


        <div
            class="logged-in"
            id="loggedInText">

            ● Logged in

        </div>


        <br>


        <div class="field">

            <label>
                Select Section
            </label>

            <select
                id="section"
                onchange="loadSection()">

                <option value="home">
                    Home
                </option>

                <option value="request">
                    Request
                </option>

                <option value="wishes">
                    Wishes
                </option>

                <option value="market">
                    Market
                </option>

                <option value="more">
                    More
                </option>

            </select>

        </div>



        <div class="field">

            <label>
                Section Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Example: Kulzzy Radio Home">

        </div>



        <div class="field">

            <label>
                Paste HTML Code
            </label>

            <textarea
                id="htmlCode"
                placeholder="Paste your complete HTML here..."></textarea>

        </div>



        <div class="buttons">

            <button
                class="publish-button"
                onclick="publishContent()">

                🚀 PUBLISH

            </button>


            <button
                class="preview-button"
                onclick="previewHTML()">

                👁️ PREVIEW

            </button>


            <button
                class="logout-button"
                onclick="logout()">

                LOGOUT

            </button>

        </div>



        <div
            class="status"
            id="publishStatus">

            Select a section.

        </div>



        <div class="preview">

            <div class="preview-title">

                HTML PREVIEW

            </div>

            <iframe
                id="previewFrame"
                sandbox="allow-scripts allow-forms allow-modals allow-popups">

            </iframe>

        </div>


    </div>


</div>



<script type="module">

import {

    initializeApp

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getDatabase,
    ref,
    set,
    get

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


import {

    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



/*
================================================
PASTE YOUR FIREBASE CONFIG HERE
================================================
*/

const firebaseConfig = {

    apiKey: "PASTE_YOUR_API_KEY",

    authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",

    databaseURL: "https://PASTE_YOUR_DATABASE_URL",

    projectId: "PASTE_YOUR_PROJECT_ID",

    storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

    appId: "PASTE_YOUR_APP_ID"

};



/*
================================================
FIREBASE INITIALIZATION
================================================
*/

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const auth =
    getAuth(app);



/*
================================================
SECTION ELEMENTS
================================================
*/

const loginBox =
    document.getElementById("loginBox");


const editorArea =
    document.getElementById("editorArea");


const loginStatus =
    document.getElementById("loginStatus");


const publishStatus =
    document.getElementById("publishStatus");



/*
================================================
LOGIN
================================================
*/

window.login = async function() {

    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    if (!email || !password) {

        loginStatus.textContent =
            "Enter your email and password.";

        return;

    }


    loginStatus.textContent =
        "Logging in...";


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        loginStatus.textContent =
            "Login successful.";


    } catch (error) {

        console.error(error);

        loginStatus.textContent =
            "Login failed: " + error.message;

    }

};



/*
================================================
AUTH STATE
================================================
*/

onAuthStateChanged(
    auth,
    function(user) {

        if (user) {

            loginBox.style.display =
                "none";

            editorArea.style.display =
                "block";

            loadSection();

        } else {

            loginBox.style.display =
                "block";

            editorArea.style.display =
                "none";

        }

    }
);



/*
================================================
LOAD SECTION FROM FIREBASE
================================================
*/

window.loadSection = async function() {

    const section =
        document.getElementById("section")
        .value;


    publishStatus.textContent =
        "Loading " + section + "...";


    try {

        const contentRef =
            ref(
                db,
                "kulzzyContent/" + section
            );


        const snapshot =
            await get(contentRef);


        if (snapshot.exists()) {

            const data =
                snapshot.val();


            document.getElementById(
                "title"
            ).value =
                data.title || "";


            document.getElementById(
                "htmlCode"
            ).value =
                data.html || "";


            publishStatus.textContent =
                section.toUpperCase() +
                " loaded.";

        } else {

            document.getElementById(
                "title"
            ).value = "";


            document.getElementById(
                "htmlCode"
            ).value = "";


            publishStatus.textContent =
                "No content published for " +
                section +
                " yet.";

        }


    } catch (error) {

        console.error(error);

        publishStatus.textContent =
            "Could not load content.";

    }

};



/*
================================================
PUBLISH
================================================
*/

window.publishContent = async function() {

    const section =
        document.getElementById("section")
        .value;


    const title =
        document.getElementById("title")
        .value
        .trim();


    const html =
        document.getElementById("htmlCode")
        .value;


    if (!html.trim()) {

        publishStatus.textContent =
            "Please paste HTML code first.";

        return;

    }


    publishStatus.textContent =
        "Publishing...";


    try {

        await set(

            ref(
                db,
                "kulzzyContent/" + section
            ),

            {

                title: title,

                html: html,

                updatedAt:
                    Date.now(),

                updatedBy:
                    auth.currentUser
                    ? auth.currentUser.uid
                    : ""

            }

        );


        publishStatus.textContent =
            "✅ " +
            section.toUpperCase() +
            " published successfully.";

    }


    catch(error) {

        console.error(error);

        publishStatus.textContent =
            "❌ Publish failed: " +
            error.message;

    }

};



/*
================================================
PREVIEW
================================================
*/

window.previewHTML = function() {

    const html =
        document.getElementById("htmlCode")
        .value;


    const frame =
        document.getElementById(
            "previewFrame"
        );


    frame.srcdoc = html;

};



/*
================================================
LOGOUT
================================================
*/

window.logout = async function() {

    await signOut(auth);

};

</script>


</body>

</html>
