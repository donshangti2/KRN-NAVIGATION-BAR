<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#07152f">

<title>Kulzzy Radio Navigation</title>

<style>

/* =========================================
   FAST GLOBAL CSS
========================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:transparent;
}

body{
    overflow-x:hidden;
}


/* =========================================
   FLOATING NAVIGATION
========================================= */

#kulzzyNav{

    position:fixed;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 16px);
    max-width:520px;

    height:48px;

    background:rgba(7,21,47,0.98);

    border:1px solid rgba(255,215,0,0.45);

    border-radius:14px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    padding:4px;

    z-index:999999;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.25);

    /* Helps browser render fixed bar efficiently */
    contain:layout paint;

}


/* =========================================
   NAVIGATION BUTTONS
========================================= */

.kulzzyNavBtn{

    flex:1;

    height:40px;

    border:none;

    background:transparent;

    color:white;

    font-size:11px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    transition:
        background 0.15s ease,
        color 0.15s ease;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;

}

.kulzzyNavBtn:hover{

    background:rgba(255,215,0,0.15);

    color:#ffd700;

}

.kulzzyNavBtn.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   CONTENT
========================================= */

#kulzzyContent{

    width:100%;

    margin:0;

    padding:70px 12px 30px;

}


/* =========================================
   SECTIONS
========================================= */

.kulzzySection{

    display:none;

    width:100%;

    max-width:700px;

    margin:0 auto;

}

.kulzzySection.active{

    display:block;

}


/* =========================================
   FIREBASE CONTENT
========================================= */

.kulzzyPublishedContent{

    width:100%;

    margin:0;

    padding:0;

    overflow:visible;

}

.kulzzyPublishedContent *{

    max-width:100%;

}

.kulzzyPublishedContent img{

    max-width:100%;

    height:auto;

    display:block;

}

.kulzzyPublishedContent video{

    max-width:100%;

    height:auto;

}

.kulzzyPublishedContent iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;

}

.kulzzyPublishedContent table{

    max-width:100%;

}


/* =========================================
   MORE PAGE LIST
========================================= */

#kulzzyMorePagesMenu{

    width:100%;

    margin:0;

    padding:0;

    display:flex;

    flex-direction:column;

    gap:10px;

}


/* =========================================
   MORE PAGE BUTTON
========================================= */

.kulzzyMorePageButton{

    width:100%;

    border:1px solid rgba(255,215,0,0.35);

    border-radius:12px;

    padding:14px 15px;

    background:#07152f;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:
        background 0.15s ease,
        color 0.15s ease;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;

}

.kulzzyMorePageButton:hover{

    background:rgba(255,215,0,0.12);

    color:#ffd700;

}

.kulzzyMorePageButton.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   MORE PAGE CONTENT
========================================= */

#kulzzyMorePageContent{

    width:100%;

    margin:15px 0 0;

    padding:0;

}


/* =========================================
   MORE PAGE CONTENT BOX
========================================= */

.kulzzyMorePageContentBox{

    width:100%;

    margin:0;

    padding:0;

    background:transparent;

    color:inherit;

    border:none;

    border-radius:0;

    overflow:visible;

    line-height:1.6;

}

.kulzzyMorePageContentBox *{

    box-sizing:border-box;

    max-width:100%;

}

.kulzzyMorePageContentBox img{

    max-width:100% !important;

    height:auto !important;

    display:block;

}

.kulzzyMorePageContentBox video{

    max-width:100% !important;

    height:auto !important;

}

.kulzzyMorePageContentBox iframe{

    display:block;

    width:100% !important;

    max-width:100% !important;

    border:0;

}

.kulzzyMorePageContentBox table{

    width:100%;

    max-width:100%;

    overflow:auto;

    display:block;

}

.kulzzyMorePageContentBox h1,
.kulzzyMorePageContentBox h2,
.kulzzyMorePageContentBox h3,
.kulzzyMorePageContentBox h4{

    max-width:100%;

}

.kulzzyMorePageContentBox p{

    line-height:1.7;

}

.kulzzyMorePageContentBox a{

    word-break:break-word;

}

.kulzzyMorePageContentBox ul,
.kulzzyMorePageContentBox ol{

    padding-left:25px;

}


/* =========================================
   LOADING
========================================= */

.kulzzyMoreLoading{

    width:100%;

    padding:15px;

    margin:0;

    background:#07152f;

    color:white;

    border:1px solid rgba(255,215,0,0.35);

    border-radius:12px;

    text-align:center;

}


/* =========================================
   STATUS
========================================= */

.kulzzyStatus{

    width:100%;

    padding:15px;

    margin:0;

    background:#07152f;

    color:white;

    border:1px solid rgba(255,215,0,0.35);

    border-radius:12px;

    text-align:center;

    line-height:1.5;

}

.kulzzyStatus strong{

    color:#ffd700;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:360px){

    #kulzzyNav{

        width:calc(100% - 8px);

        top:5px;

        height:44px;

    }

    .kulzzyNavBtn{

        height:36px;

        font-size:9px;

    }

    #kulzzyContent{

        padding-top:62px;

    }

}


@media(min-width:361px) and (max-width:600px){

    .kulzzyNavBtn{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     FLOATING NAVIGATION
===================================== -->

<nav id="kulzzyNav">

    <button
        type="button"
        class="kulzzyNavBtn active"
        onclick="kulzzyOpen('home',this)">

        Home

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('request',this)">

        Request

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('wishes',this)">

        Wishes

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('market',this)">

        Market

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('more',this)">

        More

    </button>

</nav>



<!-- =====================================
     CONTENT
===================================== -->

<div id="kulzzyContent">


    <!-- HOME -->

    <section
        id="kulzzy-home"
        class="kulzzySection active">

        <div
            id="kulzzyPublished-home"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- REQUEST -->

    <section
        id="kulzzy-request"
        class="kulzzySection">

        <div
            id="kulzzyPublished-request"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- WISHES -->

    <section
        id="kulzzy-wishes"
        class="kulzzySection">

        <div
            id="kulzzyPublished-wishes"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- MARKET -->

    <section
        id="kulzzy-market"
        class="kulzzySection">

        <div
            id="kulzzyPublished-market"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- MORE -->

    <section
        id="kulzzy-more"
        class="kulzzySection">

        <div
            id="kulzzyMorePagesMenu">
        </div>

        <div
            id="kulzzyMorePageContent">
        </div>

    </section>


</div>



<!-- =====================================
     OPTIMIZED FIREBASE SYSTEM
===================================== -->

<script type="module">

/*
================================================
 KULZZY RADIO NAVIGATION
 FAST FIREBASE LOADING VERSION
================================================

IMPORTANT:

Firebase is NOT initialized immediately.

The navigation is rendered first.

Firebase SDK is loaded only when content
needs to be retrieved.

Normal pages:
Home
Request
Wishes
Market

More pages:
Loaded only when More is opened.

Each page is cached after loading.
================================================
*/


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


/* =========================================
   FIREBASE STATE
========================================= */

let firebaseReady = null;

let db = null;


/* =========================================
   LAZY FIREBASE INITIALIZATION
========================================= */

async function getFirebaseDatabase(){

    /*
     * If Firebase is already initialized,
     * immediately return the existing database.
     */

    if(db){

        return db;

    }


    /*
     * If another request is already initializing
     * Firebase, wait for that same request.
     *
     * This prevents multiple Firebase downloads
     * or multiple initializeApp() calls.
     */

    if(firebaseReady){

        return firebaseReady;

    }


    firebaseReady =
        (async function(){

            const [

                firebaseAppModule,
                firebaseDatabaseModule

            ] =
            await Promise.all([

                import(
                    "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"
                ),

                import(
                    "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js"
                )

            ]);


            const app =
                firebaseAppModule.initializeApp(
                    firebaseConfig
                );


            db =
                firebaseDatabaseModule.getDatabase(
                    app
                );


            return {

                db:db,

                ref:
                    firebaseDatabaseModule.ref,

                get:
                    firebaseDatabaseModule.get

            };

        })();


    return firebaseReady;

}


/* =========================================
   SECTION LIST
========================================= */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];


/* =========================================
   CACHE
========================================= */

const loadedSections =
    Object.create(null);

const loadingSections =
    Object.create(null);


/* =========================================
   MORE PAGE CACHE
========================================= */

let morePagesLoaded = false;

let morePagesLoading = false;

let morePagesData = [];


/* =========================================
   EXECUTE PUBLISHED SCRIPTS
========================================= */

function executePublishedScripts(container){

    if(!container){

        return;

    }


    const scripts =
        container.querySelectorAll("script");


    scripts.forEach(function(oldScript){

        const newScript =
            document.createElement("script");


        Array.from(
            oldScript.attributes
        ).forEach(function(attribute){

            newScript.setAttribute(
                attribute.name,
                attribute.value
            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(oldScript.parentNode){

            oldScript.parentNode.replaceChild(
                newScript,
                oldScript
            );

        }

    });

}


/* =========================================
   GET PAGE HTML
========================================= */

function getPageHTML(page){

    if(!page){

        return "";

    }


    if(
        typeof page.html === "string" &&
        page.html.trim()
    ){

        return page.html;

    }


    const possibleFields = [

        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"

    ];


    for(
        const field of possibleFields
    ){

        if(
            typeof page[field] === "string" &&
            page[field].trim()
        ){

            return page[field];

        }

    }


    if(
        page.blocks &&
        typeof page.blocks === "object"
    ){

        const blocks =
            Object.keys(page.blocks)

            .map(function(id){

                const block =
                    page.blocks[id] || {};


                return {

                    id:id,

                    html:
                        block.html ||
                        block.content ||
                        block.writeUp ||
                        "",

                    order:
                        typeof block.order === "number"
                        ? block.order
                        : 0

                };

            })

            .filter(function(block){

                return (
                    typeof block.html === "string" &&
                    block.html.trim()
                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        if(blocks.length){

            return blocks

                .map(function(block){

                    return block.html;

                })

                .join("\n\n");

        }

    }


    return "";

}


/* =========================================
   SHOW LOADING
========================================= */

function showSectionLoading(container){

    if(!container){

        return;

    }


    container.innerHTML = `

        <div class="kulzzyMoreLoading">

            Loading...

        </div>

    `;

}


/* =========================================
   LOAD ONE NORMAL SECTION
========================================= */

async function loadNormalSection(section){

    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );


    if(!container){

        return;

    }


    /*
     * Already loaded.
     */

    if(loadedSections[section]){

        return;

    }


    /*
     * Already loading.
     */

    if(loadingSections[section]){

        return loadingSections[section];

    }


    /*
     * Create one loading promise.
     */

    loadingSections[section] =
        (async function(){

            try{

                /*
                 * Show loading immediately.
                 */

                showSectionLoading(
                    container
                );


                /*
                 * Load Firebase only now.
                 */

                const firebase =
                    await getFirebaseDatabase();


                /*
                 * Read ONLY the requested section.
                 */

                const contentRef =
                    firebase.ref(
                        db,
                        "kulzzyContent/" + section
                    );


                const snapshot =
                    await firebase.get(
                        contentRef
                    );


                container.innerHTML = "";


                /*
                 * No content.
                 */

                if(!snapshot.exists()){

                    loadedSections[section] = true;

                    return;

                }


                const data =
                    snapshot.val();


                const html =
                    getPageHTML(data);


                /*
                 * Empty content.
                 */

                if(!html.trim()){

                    loadedSections[section] = true;

                    return;

                }


                /*
                 * Insert content.
                 */

                const wrapper =
                    document.createElement("div");


                wrapper.innerHTML =
                    html;


                container.appendChild(
                    wrapper
                );


                /*
                 * Execute scripts contained
                 * inside published content.
                 */

                executePublishedScripts(
                    wrapper
                );


                loadedSections[section] = true;

            }

            catch(error){

                console.error(
                    "Firebase error:",
                    section,
                    error
                );


                container.innerHTML = `

                    <div class="kulzzyStatus">

                        <strong>
                            Content could not be loaded.
                        </strong>

                    </div>

                `;

            }

        })();


    try{

        await loadingSections[section];

    }

    finally{

        delete loadingSections[section];

    }

}


/* =========================================
   LOAD MORE PAGES
========================================= */

async function loadMorePages(){

    const menu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );


    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!menu || !content){

        return;

    }


    /*
     * Already loaded.
     */

    if(morePagesLoaded){

        return;

    }


    /*
     * Already loading.
     */

    if(morePagesLoading){

        return;

    }


    morePagesLoading = true;


    menu.innerHTML = `

        <div class="kulzzyMoreLoading">

            Loading More Pages...

        </div>

    `;


    content.innerHTML = "";


    try{

        /*
         * Firebase is loaded only when
         * More is actually opened.
         */

        const firebase =
            await getFirebaseDatabase();


        const morePagesRef =
            firebase.ref(
                db,
                "kulzzyMorePages"
            );


        const snapshot =
            await firebase.get(
                morePagesRef
            );


        menu.innerHTML = "";

        content.innerHTML = "";


        /*
         * No More pages.
         */

        if(!snapshot.exists()){

            const message =
                document.createElement("div");


            message.className =
                "kulzzyStatus";


            message.innerHTML =
                "<strong>No MORE pages available.</strong>";


            menu.appendChild(
                message
            );


            morePagesLoaded = true;

            return;

        }


        const data =
            snapshot.val();


        /*
         * Convert Firebase object
         * into sorted array.
         */

        morePagesData =
            Object.keys(data)

            .map(function(id){

                const page =
                    data[id] || {};


                return {

                    id:id,

                    title:
                        page.title ||
                        page.name ||
                        "Untitled Page",

                    html:
                        getPageHTML(page),

                    order:
                        typeof page.order === "number"
                        ? page.order
                        : 0

                };

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        /*
         * Create More buttons.
         */

        const fragment =
            document.createDocumentFragment();


        morePagesData.forEach(function(page){

            const button =
                document.createElement("button");


            button.type =
                "button";


            button.className =
                "kulzzyMorePageButton";


            button.textContent =
                page.title;


            button.addEventListener(
                "click",
                function(){

                    showMorePage(
                        page,
                        button
                    );

                }
            );


            fragment.appendChild(
                button
            );

        });


        menu.appendChild(
            fragment
        );


        morePagesLoaded = true;

    }

    catch(error){

        console.error(
            "Firebase MORE page error:",
            error
        );


        menu.innerHTML = "";


        const errorBox =
            document.createElement("div");


        errorBox.className =
            "kulzzyStatus";


        errorBox.innerHTML = `

            <strong>
                MORE pages could not be loaded.
            </strong>

        `;


        menu.appendChild(
            errorBox
        );

    }

    finally{

        morePagesLoading = false;

    }

}


/* =========================================
   DISPLAY MORE PAGE
========================================= */

function showMorePage(page,button){

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    /*
     * Remove active state.
     */

    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    /*
     * Activate selected button.
     */

    if(button){

        button.classList.add(
            "active"
        );

    }


    /*
     * Clear old content.
     */

    content.innerHTML = "";


    /*
     * Get page HTML.
     */

    const html =
        getPageHTML(page);


    /*
     * Empty page.
     */

    if(!html.trim()){

        const empty =
            document.createElement("div");


        empty.className =
            "kulzzyStatus";


        empty.innerHTML =
            "<strong>" +
            "This MORE page has no write-up content." +
            "</strong>";


        content.appendChild(
            empty
        );


        return;

    }


    /*
     * Create content box.
     */

    const pageBox =
        document.createElement("div");


    pageBox.className =
        "kulzzyMorePageContentBox";


    pageBox.innerHTML =
        html;


    content.appendChild(
        pageBox
    );


    /*
     * Execute scripts.
     */

    executePublishedScripts(
        pageBox
    );

}


/* =========================================
   NAVIGATION
========================================= */

window.kulzzyOpen =
async function(section,button){

    /*
     * Immediately change active button.
     * Do NOT wait for Firebase.
     */

    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    /*
     * Hide all sections immediately.
     */

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    /*
     * Show selected section immediately.
     */

    const selected =
        document.getElementById(
            "kulzzy-" + section
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    /*
     * Load only what was requested.
     */

    if(
        normalSections.includes(section)
    ){

        await loadNormalSection(
            section
        );

        return;

    }


    /*
     * More is loaded only when opened.
     */

    if(section === "more"){

        await loadMorePages();

    }

};


/* =========================================
   START HOME IMMEDIATELY
========================================= */

/*
 * The navigation is already visible before
 * this function runs.
 *
 * Home is the ONLY Firebase content requested
 * automatically.
 */

requestAnimationFrame(function(){

    loadNormalSection("home");

});


/* =========================================
   OPTIONAL BACKGROUND WARM-UP
========================================= */

/*
 * Start downloading Firebase after the browser
 * has had an opportunity to paint the page.
 *
 * This does NOT read Firebase data.
 *
 * It simply prepares Firebase so that when Home
 * needs it, initialization is already underway.
 */

if(
    "requestIdleCallback" in window
){

    requestIdleCallback(
        function(){

            getFirebaseDatabase();

        },
        {
            timeout:1500
        }
    );

}
else{

    setTimeout(
        function(){

            getFirebaseDatabase();

        },
        300
    );

}

</script>


</body>

</html>
