<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Navigation</title>


<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:transparent;

}

body{
    overflow-x:hidden;
}


/* =========================================
   FLOATING NAVIGATION
========================================= */

#kulzzyNav{

    position:fixed;

    top:8px;

    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 16px);

    max-width:520px;

    height:48px;

    background:rgba(7,21,47,0.98);

    border:1px solid rgba(255,215,0,0.45);

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:4px;

    z-index:999999;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.25);

}


/* =========================================
   NAVIGATION BUTTONS
========================================= */

.kulzzyNavBtn{

    flex:1;

    height:40px;

    border:none;

    background:transparent;

    color:white;

    font-size:11px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    transition:background 0.12s ease, color 0.12s ease, transform 0.08s ease;
.kulzzyNavBtn:active{
    transform:scale(0.94);
}
    -webkit-tap-highlight-color:transparent;

}

.kulzzyNavBtn:hover{

    background:
        rgba(255,215,0,0.15);

    color:#ffd700;

}

.kulzzyNavBtn.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   CONTENT
========================================= */

#kulzzyContent{
    width:100%;
    margin:0;
    padding:75px 0 230px;
}


/* =========================================
   SECTIONS
========================================= */

.kulzzySection{
    display:none;
    width:100%;
    max-width:700px;
    margin:0 auto;
    animation:kulzzySectionIn .25s ease;
}

.kulzzySection.active{
    display:block;
}

@keyframes kulzzySectionIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.kulzzySection.active{

    display:block;

}


/* =========================================
   FIREBASE CONTENT
========================================= */

.kulzzyPublishedContent{

    width:100%;

    margin:0;

    padding:0;

    overflow:visible;

}

.kulzzyPublishedContent *{

    max-width:100%;

}

.kulzzyPublishedContent img{

    max-width:100%;

    height:auto;

}

.kulzzyPublishedContent video{

    max-width:100%;

    height:auto;

}

.kulzzyPublishedContent iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;

}

.kulzzyPublishedContent table{

    max-width:100%;

}


/* =========================================
   MORE PAGE LIST
========================================= */

#kulzzyMorePagesMenu{

    width:100%;

    margin:0;

    padding:0;

    display:flex;

    flex-direction:column;

    gap:10px;

}


/* =========================================
   MORE PAGE BUTTON
========================================= */

.kulzzyMorePageButton{

    width:100%;

    border:1px solid
        rgba(255,215,0,0.35);

    border-radius:12px;

    padding:14px 15px;

    background:#07152f;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s ease;

    -webkit-tap-highlight-color:transparent;

}

.kulzzyMorePageButton:hover{

    background:
        rgba(255,215,0,0.12);

    color:#ffd700;

}

.kulzzyMorePageButton.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   MORE PAGE CONTENT
========================================= */

#kulzzyMorePageContent{

    width:100%;

    margin:15px 0 0;

    padding:0;

}

.kulzzyMorePageContentBox{

    width:100%;

    margin:0;

    padding:0;

    background:transparent;

    color:inherit;

    border:none;

    border-radius:0;

    overflow:visible;

    line-height:1.6;

}


/* =========================================
   MORE PAGE ELEMENTS
========================================= */

.kulzzyMorePageContentBox *{

    box-sizing:border-box;

    max-width:100%;

}

.kulzzyMorePageContentBox img{

    max-width:100% !important;

    height:auto !important;

}

.kulzzyMorePageContentBox video{

    max-width:100% !important;

    height:auto !important;

}

.kulzzyMorePageContentBox iframe{

    display:block;

    width:100% !important;

    max-width:100% !important;

    border:0;

}

.kulzzyMorePageContentBox table{

    width:100%;

    max-width:100%;

    overflow:auto;

    display:block;

}

.kulzzyMorePageContentBox h1,
.kulzzyMorePageContentBox h2,
.kulzzyMorePageContentBox h3,
.kulzzyMorePageContentBox h4{

    max-width:100%;

}

.kulzzyMorePageContentBox p{

    line-height:1.7;

}

.kulzzyMorePageContentBox a{

    word-break:break-word;

}

.kulzzyMorePageContentBox ul,
.kulzzyMorePageContentBox ol{

    padding-left:25px;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:360px){

    #kulzzyNav{

        width:calc(100% - 8px);

        top:5px;

        height:44px;

    }


    .kulzzyNavBtn{

        height:36px;

        font-size:9px;

    }


    #kulzzyContent{

        padding-top:62px;

    }

}


@media(min-width:361px)
and (max-width:600px){

    .kulzzyNavBtn{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     FLOATING NAVIGATION
===================================== -->

<nav id="kulzzyNav">


    <button
        type="button"
        class="kulzzyNavBtn active"
        data-section="home">

        Home

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="request">

        Request

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="wishes">

        Wishes

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="market">

        Market

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="more">

        More

    </button>


</nav>


<!-- =====================================
     CONTENT
===================================== -->

<div id="kulzzyContent">


    <!-- HOME -->

    <section
        id="kulzzy-home"
        class="kulzzySection active">

        <div
            id="kulzzyPublished-home"
            class="kulzzyPublishedContent">
        </div>

    </section>


    <!-- REQUEST -->

    <section
        id="kulzzy-request"
        class="kulzzySection">

        <div
            id="kulzzyPublished-request"
            class="kulzzyPublishedContent">
        </div>

    </section>


    <!-- WISHES -->

    <section
        id="kulzzy-wishes"
        class="kulzzySection">

        <div
            id="kulzzyPublished-wishes"
            class="kulzzyPublishedContent">
        </div>

    </section>


    <!-- MARKET -->

    <section
        id="kulzzy-market"
        class="kulzzySection">

        <div
            id="kulzzyPublished-market"
            class="kulzzyPublishedContent">
        </div>

    </section>


    <!-- MORE -->

    <section
        id="kulzzy-more"
        class="kulzzySection">

        <div
            id="kulzzyMorePagesMenu">
        </div>


        <div
            id="kulzzyMorePageContent">
        </div>

    </section>


</div>


<!-- =====================================
     FIREBASE
===================================== -->

<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getDatabase,
    ref,
    get

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* =========================================
   FIREBASE CONFIGURATION
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

let app = null;

let db = null;


try{

    app =
        initializeApp(
            firebaseConfig
        );


    db =
        getDatabase(
            app
        );

}

catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =========================================
   NORMAL SECTIONS
========================================= */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];


/* =========================================
   FAST MEMORY CACHE
========================================= */

const sectionCache =
    Object.create(null);


const sectionLoading =
    Object.create(null);


/* =========================================
   MORE CACHE
========================================= */

let morePagesLoaded = false;

let morePagesLoading = null;

let morePagesData = [];


/* =========================================
   GET PAGE HTML
========================================= */

function getPageHTML(page){

    if(!page){

        return "";

    }


    if(

        typeof page.html === "string" &&

        page.html.trim()

    ){

        return page.html;

    }


    const possibleFields = [

        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"

    ];


    for(
        const field of possibleFields
    ){

        if(

            typeof page[field] === "string" &&

            page[field].trim()

        ){

            return page[field];

        }

    }


    if(

        page.blocks &&

        typeof page.blocks === "object"

    ){

        const blocks =

            Object.keys(
                page.blocks
            )

            .map(function(id){

                const block =
                    page.blocks[id] || {};


                return {

                    id:id,

                    html:

                        block.html ||

                        block.content ||

                        block.writeUp ||

                        "",

                    order:

                        typeof block.order === "number"

                        ? block.order

                        : 0

                };

            })

            .filter(function(block){

                return (

                    typeof block.html ===
                    "string" &&

                    block.html.trim()

                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        if(blocks.length){

            return blocks

                .map(function(block){

                    return block.html;

                })

                .join("\n\n");

        }

    }


    return "";

}


/* =========================================
   EXECUTE PUBLISHED SCRIPTS
========================================= */

function executePublishedScripts(
    container
){

    if(!container){

        return;

    }


    const scripts =
        container.querySelectorAll(
            "script"
        );


    scripts.forEach(function(
        oldScript
    ){

        const newScript =
            document.createElement(
                "script"
            );


        Array.from(
            oldScript.attributes
        )

        .forEach(function(attribute){

            newScript.setAttribute(

                attribute.name,

                attribute.value

            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(oldScript.parentNode){

            oldScript.parentNode
                .replaceChild(
                    newScript,
                    oldScript
                );

        }

    });

}


/* =========================================
   DISPLAY NORMAL CONTENT
========================================= */

function displayNormalContent(
    section,
    html
){

    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    if(!html || !html.trim()){

        container.innerHTML = "";

        sectionCache[section] = "";

        return;

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.innerHTML =
        html;


    container.innerHTML = "";


    container.appendChild(
        wrapper
    );


    /*
       Execute scripts only after
       the content has been inserted.
    */

    executePublishedScripts(
        wrapper
    );


    /*
       Save the rendered HTML in memory
       so returning to the section is instant.
    */

    sectionCache[section] =
        container.innerHTML;

}


/* =========================================
   LOAD NORMAL SECTION
========================================= */

async function loadNormalSection(
    section
){

    if(
        !normalSections.includes(
            section
        )
    ){

        return;

    }


    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    /*
       Already successfully loaded.
    */

    if(
        Object.prototype.hasOwnProperty.call(
            sectionCache,
            section
        )
    ){

        if(
            container.innerHTML === ""
            &&
            sectionCache[section]
        ){

            container.innerHTML =
                sectionCache[section];

        }

        return;

    }


    /*
       If this section is already
       being downloaded, wait for it.
    */

    if(
        sectionLoading[section]
    ){

        return sectionLoading[section];

    }


    if(!db){

        return;

    }


    /*
       Start Firebase request.
    */

    sectionLoading[section] =

        get(

            ref(

                db,

                "kulzzyContent/" +
                section

            )

        )

        .then(function(snapshot){

            if(
                !snapshot.exists()
            ){

                container.innerHTML = "";

                sectionCache[section] = "";

                return;

            }


            const data =
                snapshot.val();


            const html =
                getPageHTML(
                    data
                );


            displayNormalContent(
                section,
                html
            );

        })

        .catch(function(error){

            /*
               Keep the screen clean.
               No loading text.
               No Firebase error shown
               to visitors.
            */

            console.error(
                "Firebase section error:",
                section,
                error
            );

        })

        .finally(function(){

            delete sectionLoading[
                section
            ];

        });


    return sectionLoading[section];

}


/* =========================================
   OPEN SECTION
========================================= */

function openSection(
    section,
    button
){
localStorage.setItem(
    "kulzzyLastSection",
    section
);
    /*
       Switch the visible section
       immediately.
    */

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "kulzzy-" +
            section
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    /*
       Update active navigation button.
    */

    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
          /* =========================================
   RESTORE LAST OPENED SECTION
========================================= */

const savedSection =
    localStorage.getItem(
        "kulzzyLastSection"
    );

if(savedSection){

    const savedButton =
        document.querySelector(
            '.kulzzyNavBtn[data-section="' +
            savedSection +
            '"]'
        );

    if(savedButton){

        openSection(
            savedSection,
            savedButton
        );

    }

}
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    /*
       Firebase content is loaded
       only when needed.
    */

    if(
        normalSections.includes(
            section
        )
    ){

        loadNormalSection(
            section
        );

    }


    /*
       More is lazy-loaded.
    */

    if(
        section === "more"
    ){

        loadMorePages();

    }

}


/* =========================================
   PUBLIC NAVIGATION
========================================= */

window.kulzzyOpen =

    function(
        section,
        button
    ){

        openSection(
            section,
            button
        );

    };


/* =========================================
   NAVIGATION EVENTS
========================================= */

document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(

                    button.dataset.section,

                    button

                );

            }
        );

    });


/* =========================================
   LOAD MORE PAGES
========================================= */

async function loadMorePages(){

    const menu =

        document.getElementById(
            "kulzzyMorePagesMenu"
        );


    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(
        !menu ||
        !content
    ){

        return;

    }


    if(
        morePagesLoaded
    ){

        return;

    }


    if(
        morePagesLoading
    ){

        return morePagesLoading;

    }


    if(!db){

        return;

    }


    morePagesLoading =

        get(

            ref(

                db,

                "kulzzyMorePages"

            )

        )

        .then(function(snapshot){

            menu.innerHTML = "";

            content.innerHTML = "";


            if(
                !snapshot.exists()
            ){

                morePagesLoaded = true;

                return;

            }


            const data =
                snapshot.val();


            morePagesData =

                Object.keys(
                    data
                )

                .map(function(id){

                    const page =
                        data[id] || {};


                    return {

                        id:id,

                        title:

                            page.title ||

                            page.name ||

                            "Untitled Page",

                        html:

                            getPageHTML(
                                page
                            ),

                        order:

                            typeof page.order ===
                            "number"

                            ? page.order

                            : 0

                    };

                })

                .sort(function(a,b){

                    return a.order -
                           b.order;

                });


            const fragment =
                document.createDocumentFragment();


            morePagesData.forEach(
                function(page){

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "kulzzyMorePageButton";


                    button.textContent =
                        page.title;


                    button.addEventListener(
                        "click",
                        function(){

                            showMorePage(
                                page,
                                button
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            menu.appendChild(
                fragment
            );


            morePagesLoaded =
                true;

        })

        .catch(function(error){

            console.error(
                "Firebase More pages error:",
                error
            );

        })

        .finally(function(){

            morePagesLoading =
                null;

        });


    return morePagesLoading;

}


/* =========================================
   SHOW MORE PAGE
========================================= */

function showMorePage(
    page,
    button
){

    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    content.innerHTML = "";


    const html =
        getPageHTML(
            page
        );


    if(
        !html ||
        !html.trim()
    ){

        return;

    }


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "kulzzyMorePageContentBox";


    pageBox.innerHTML =
        html;


    content.appendChild(
        pageBox
    );


    executePublishedScripts(
        pageBox
    );

}


/* =========================================
   STARTUP
========================================= */

/*
   IMPORTANT:

   Only HOME is requested immediately.

   Request, Wishes and Market are
   downloaded when the visitor taps them.

   More is downloaded when More is opened.

   There is NO loading message.
*/

if(db){

    loadNormalSection(
        "home"
    );

}


/* =========================================
   OPTIONAL BACKGROUND PRELOAD
========================================= */

/*
   After Home has been requested, we quietly
   prepare the other sections in the background.

   This does NOT display "Loading...".

   The visitor can therefore tap a section
   while Firebase is already preparing it.
*/

setTimeout(function(){

    if(!db){

        return;

    }


    [
        "request",
        "wishes",
        "market"
    ]

    .forEach(function(section){

        if(
            !Object.prototype.hasOwnProperty.call(
                sectionCache,
                section
            )
        ){

            loadNormalSection(
                section
            );

        }

    });

}, 1200);


</script>


</body>

</html>
