<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Navigation</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    padding:0;

    width:100%;

    min-height:100%;

    font-family:Arial,Helvetica,sans-serif;

    background:transparent;

}


body{

    overflow-x:hidden;

}


/* =========================================
   FLOATING NAVIGATION
========================================= */

#kulzzyNav{

    position:fixed;

    top:8px;

    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 16px);

    max-width:520px;

    height:48px;

    background:rgba(7,21,47,0.98);

    border:1px solid rgba(255,215,0,0.45);

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:4px;

    z-index:999999;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.25);

}


/* =========================================
   NAVIGATION BUTTONS
========================================= */

.kulzzyNavBtn{

    flex:1;

    height:40px;

    border:none;

    background:transparent;

    color:white;

    font-size:11px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    transition:0.2s ease;

    -webkit-tap-highlight-color:transparent;

}


.kulzzyNavBtn:hover{

    background:
        rgba(255,215,0,0.15);

    color:#ffd700;

}


.kulzzyNavBtn.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   CONTENT
========================================= */

#kulzzyContent{

    width:100%;

    margin:0;

    padding:70px 12px 30px;

}


/* =========================================
   SECTIONS
========================================= */

.kulzzySection{

    display:none;

    width:100%;

    max-width:700px;

    margin:0 auto;

}


.kulzzySection.active{

    display:block;

}


/* =========================================
   FIREBASE CONTENT
========================================= */

.kulzzyPublishedContent{

    width:100%;

    margin:0;

    padding:0;

    overflow:visible;

}


.kulzzyPublishedContent *{

    max-width:100%;

}


.kulzzyPublishedContent img{

    max-width:100%;

    height:auto;

}


.kulzzyPublishedContent video{

    max-width:100%;

    height:auto;

}


.kulzzyPublishedContent iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;

}


.kulzzyPublishedContent table{

    max-width:100%;

}


/* =========================================
   MORE PAGE LIST
========================================= */

#kulzzyMorePagesMenu{

    width:100%;

    margin:0;

    padding:0;

    display:flex;

    flex-direction:column;

    gap:10px;

}


/* =========================================
   MORE PAGE BUTTON
========================================= */

.kulzzyMorePageButton{

    width:100%;

    border:1px solid
        rgba(255,215,0,0.35);

    border-radius:12px;

    padding:14px 15px;

    background:#07152f;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s ease;

    -webkit-tap-highlight-color:transparent;

}


.kulzzyMorePageButton:hover{

    background:
        rgba(255,215,0,0.12);

    color:#ffd700;

}


.kulzzyMorePageButton.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   MORE PAGE CONTENT
========================================= */

#kulzzyMorePageContent{

    width:100%;

    margin:15px 0 0;

    padding:0;

}


.kulzzyMorePageContentBox{

    width:100%;

    margin:0;

    padding:0;

    background:transparent;

    color:inherit;

    border:none;

    border-radius:0;

    overflow:visible;

    line-height:1.6;

}


/* =========================================
   MORE PAGE ELEMENTS
========================================= */

.kulzzyMorePageContentBox *{

    box-sizing:border-box;

    max-width:100%;

}


.kulzzyMorePageContentBox img{

    max-width:100% !important;

    height:auto !important;

}


.kulzzyMorePageContentBox video{

    max-width:100% !important;

    height:auto !important;

}


.kulzzyMorePageContentBox iframe{

    display:block;

    width:100% !important;

    max-width:100% !important;

    border:0;

}


.kulzzyMorePageContentBox table{

    width:100%;

    max-width:100%;

    overflow:auto;

    display:block;

}


.kulzzyMorePageContentBox h1,
.kulzzyMorePageContentBox h2,
.kulzzyMorePageContentBox h3,
.kulzzyMorePageContentBox h4{

    max-width:100%;

}


.kulzzyMorePageContentBox p{

    line-height:1.7;

}


.kulzzyMorePageContentBox a{

    word-break:break-word;

}


.kulzzyMorePageContentBox ul,
.kulzzyMorePageContentBox ol{

    padding-left:25px;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:360px){

    #kulzzyNav{

        width:calc(100% - 8px);

        top:5px;

        height:44px;

    }


    .kulzzyNavBtn{

        height:36px;

        font-size:9px;

    }


    #kulzzyContent{

        padding-top:62px;

    }

}


@media(min-width:361px)
and (max-width:600px){

    .kulzzyNavBtn{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     FLOATING NAVIGATION
===================================== -->

<nav id="kulzzyNav">


    <button
        type="button"
        class="kulzzyNavBtn active"
        data-section="home">

        Home

    </button>



    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="request">

        Request

    </button>



    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="wishes">

        Wishes

    </button>



    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="market">

        Market

    </button>



    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="more">

        More

    </button>


</nav>



<!-- =====================================
     CONTENT
===================================== -->

<div id="kulzzyContent">


    <!-- HOME -->

    <section
        id="kulzzy-home"
        class="kulzzySection active">

        <div
            id="kulzzyPublished-home"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- REQUEST -->

    <section
        id="kulzzy-request"
        class="kulzzySection">

        <div
            id="kulzzyPublished-request"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- WISHES -->

    <section
        id="kulzzy-wishes"
        class="kulzzySection">

        <div
            id="kulzzyPublished-wishes"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- MARKET -->

    <section
        id="kulzzy-market"
        class="kulzzySection">

        <div
            id="kulzzyPublished-market"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- MORE -->

    <section
        id="kulzzy-more"
        class="kulzzySection">

        <div
            id="kulzzyMorePagesMenu">
        </div>


        <div
            id="kulzzyMorePageContent">
        </div>

    </section>


</div>



<!-- =====================================
     FIREBASE
===================================== -->

<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getDatabase,
    ref,
    get

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";



/* =========================================
   EXISTING FIREBASE CONFIGURATION
========================================= */

const firebaseConfig = {


    apiKey:

        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",


    authDomain:

        "kulzzy-radio-chat.firebaseapp.com",


    databaseURL:

        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",


    projectId:

        "kulzzy-radio-chat",


    storageBucket:

        "kulzzy-radio-chat.firebasestorage.app",


    messagingSenderId:

        "510100635134",


    appId:

        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};



/* =========================================
   INITIALIZE FIREBASE IMMEDIATELY
========================================= */

let app;

let db;

try{

    app =
        initializeApp(
            firebaseConfig
        );


    db =
        getDatabase(
            app
        );

}

catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}



/* =========================================
   NORMAL SECTIONS
========================================= */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];



/* =========================================
   CACHE
========================================= */

const loadedSections =
    Object.create(null);


const loadingSections =
    Object.create(null);



/* =========================================
   MORE CACHE
========================================= */

let morePagesLoaded =
    false;


let morePagesLoading =
    false;


let morePagesData =
    [];



/* =========================================
   GET PAGE HTML
========================================= */

function getPageHTML(page){

    if(!page){

        return "";

    }


    if(

        typeof page.html === "string" &&

        page.html.trim()

    ){

        return page.html;

    }


    const possibleFields = [

        "content",

        "writeUp",

        "writeup",

        "body",

        "description",

        "pageContent",

        "htmlContent"

    ];


    for(

        const field of possibleFields

    ){

        if(

            typeof page[field] === "string" &&

            page[field].trim()

        ){

            return page[field];

        }

    }


    if(

        page.blocks &&

        typeof page.blocks === "object"

    ){

        const blocks =

            Object.keys(
                page.blocks
            )

            .map(function(id){

                const block =
                    page.blocks[id] || {};


                return {

                    id:id,

                    html:

                        block.html ||

                        block.content ||

                        block.writeUp ||

                        "",


                    order:

                        typeof block.order === "number"

                        ? block.order

                        : 0

                };

            })

            .filter(function(block){

                return (

                    typeof block.html ===
                    "string" &&

                    block.html.trim()

                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        if(
            blocks.length
        ){

            return blocks

                .map(function(block){

                    return block.html;

                })

                .join("\n\n");

        }

    }


    return "";

}



/* =========================================
   EXECUTE PUBLISHED SCRIPTS
========================================= */

function executePublishedScripts(
    container
){

    if(!container){

        return;

    }


    const scripts =
        container.querySelectorAll(
            "script"
        );


    scripts.forEach(function(
        oldScript
    ){

        const newScript =
            document.createElement(
                "script"
            );


        Array.from(
            oldScript.attributes
        )

        .forEach(function(attribute){

            newScript.setAttribute(

                attribute.name,

                attribute.value

            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(
            oldScript.parentNode
        ){

            oldScript.parentNode
                .replaceChild(
                    newScript,
                    oldScript
                );

        }

    });

}



/* =========================================
   DISPLAY PAGE CONTENT
========================================= */

function displayNormalContent(
    section,
    html
){

    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    container.innerHTML =
        "";


    if(
        !html ||
        !html.trim()
    ){

        loadedSections[section] =
            true;

        return;

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.innerHTML =
        html;


    container.appendChild(
        wrapper
    );


    executePublishedScripts(
        wrapper
    );


    loadedSections[section] =
        true;

}



/* =========================================
   LOAD NORMAL PAGE
========================================= */

async function loadNormalSection(
    section
){

    if(
        !normalSections.includes(
            section
        )
    ){

        return;

    }


    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    if(
        loadedSections[section]
    ){

        return;

    }


    if(
        loadingSections[section]
    ){

        return loadingSections[section];

    }


    if(!db){

        console.error(
            "Firebase database is unavailable."
        );

        return;

    }


    loadingSections[section] =

        (async function(){

            try{

                const snapshot =

                    await get(

                        ref(

                            db,

                            "kulzzyContent/" +
                            section

                        )

                    );


                if(
                    !snapshot.exists()
                ){

                    loadedSections[section] =
                        true;

                    return;

                }


                const data =
                    snapshot.val();


                const html =
                    getPageHTML(
                        data
                    );


                displayNormalContent(
                    section,
                    html
                );

            }

            catch(error){

                console.error(

                    "Firebase read error:",
                    section,
                    error

                );


                /*
                 * IMPORTANT:
                 *
                 * Nothing is displayed to
                 * visitors here.
                 *
                 * No "Loading..."
                 *
                 * No "Could not load..."
                 */

            }

        })();


    try{

        await loadingSections[
            section
        ];

    }

    finally{

        delete loadingSections[
            section
        ];

    }

}



/* =========================================
   LOAD ALL NORMAL PAGES IN PARALLEL
========================================= */

function preloadAllNormalSections(){

    normalSections.forEach(
        function(section){

            loadNormalSection(
                section
            );

        }
    );

}



/* =========================================
   SHOW SECTION
========================================= */

function openSection(
    section,
    button
){

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "kulzzy-" +
            section
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        normalSections.includes(
            section
        )
    ){

        loadNormalSection(
            section
        );

    }


    if(
        section === "more"
    ){

        loadMorePages();

    }

}



/* =========================================
   PUBLIC NAVIGATION FUNCTION
========================================= */

window.kulzzyOpen =

    function(
        section,
        button
    ){

        openSection(
            section,
            button
        );

    };



/* =========================================
   NAVIGATION EVENTS
========================================= */

document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(

                    button.dataset.section,

                    button

                );

            }
        );

    });



/* =========================================
   LOAD MORE PAGES
========================================= */

   async function loadMorePages(){

    const menu =

        document.getElementById(
            "kulzzyMorePagesMenu"
        );


    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(
        !menu ||
        !content
    ){

        return;

    }


    if(
        morePagesLoaded
    ){

        return;

    }


    if(
        morePagesLoading
    ){

        return morePagesLoading;

    }


    if(!db){

        return;

    }


    morePagesLoading =

        (async function(){

            try{

                const snapshot =

                    await get(

                        ref(

                            db,

                            "kulzzyMorePages"

                        )

                    );


                menu.innerHTML =
                    "";


                content.innerHTML =
                    "";


                if(
                    !snapshot.exists()
                ){

                    morePagesLoaded =
                        true;

                    return;

                }


                const data =
                    snapshot.val();


                morePagesData =

                    Object.keys(
                        data
                    )

                    .map(function(id){

                        const page =
                            data[id] || {};


                        return {

                            id:id,

                            title:

                                page.title ||

                                page.name ||

                                "Untitled Page",


                            html:

                                getPageHTML(
                                    page
                                ),


                            order:

                                typeof page.order ===
                                "number"

                                ? page.order

                                : 0

                        };

                    })

                    .sort(function(a,b){

                        return a.order -
                               b.order;

                    });


                const fragment =
                    document.createDocumentFragment();


                morePagesData.forEach(
                    function(page){

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "kulzzyMorePageButton";


                        button.textContent =
                            page.title;


                        button.addEventListener(
                            "click",
                            function(){

                                showMorePage(

                                    page,

                                    button

                                );

                            }
                        );


                        fragment.appendChild(
                            button
                        );

                    }
                );


                menu.appendChild(
                    fragment
                );


                morePagesLoaded =
                    true;

            }

            catch(error){

                console.error(

                    "Firebase More pages error:",

                    error

                );


                /*
                 * Do not display an error
                 * message to visitors.
                 */

            }

            finally{

                morePagesLoading =
                    false;

            }

        })();


    return morePagesLoading;

}



/* =========================================
   SHOW MORE PAGE
========================================= */

function showMorePage(
    page,
    button
){

    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    document

        .querySelectorAll(
            ".kulzzyMorePageButton"
        )

        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    content.innerHTML =
        "";


    const html =
        getPageHTML(
            page
        );


    if(
        !html ||
        !html.trim()
    ){

        return;

    }


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "kulzzyMorePageContentBox";


    pageBox.innerHTML =
        html;


    content.appendChild(
        pageBox
    );


    executePublishedScripts(
        pageBox
    );

}



/* =========================================
   START FIREBASE LOADING IMMEDIATELY
========================================= */

/*
 * There is intentionally NO loading
 * message here.
 *
 * Firebase starts in the background as soon
 * as the page is ready.
 */

if(db){

    preloadAllNormalSections();

}

</script>


</body>

</html>
