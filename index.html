<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Navigation</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:transparent;
}


/* =========================================
   FLOATING NAVIGATION
========================================= */

#kulzzyNav{

    position:fixed;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 16px);
    max-width:520px;

    height:48px;

    background:rgba(7,21,47,0.98);

    border:1px solid rgba(255,215,0,0.45);

    border-radius:14px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    padding:4px;

    z-index:999999;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.25);

}


/* =========================================
   NAVIGATION BUTTONS
========================================= */

.kulzzyNavBtn{

    flex:1;

    height:40px;

    border:none;

    background:transparent;

    color:white;

    font-size:11px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    transition:0.2s ease;

    -webkit-tap-highlight-color:transparent;

}

.kulzzyNavBtn:hover{

    background:rgba(255,215,0,0.15);

    color:#ffd700;

}

.kulzzyNavBtn.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   CONTENT
========================================= */

#kulzzyContent{

    width:100%;

    margin:0;

    padding:70px 12px 30px;

}


/* =========================================
   SECTIONS
========================================= */

.kulzzySection{

    display:none;

    width:100%;

    max-width:700px;

    margin:0 auto;

}

.kulzzySection.active{

    display:block;

}


/* =========================================
   FIREBASE CONTENT
========================================= */

.kulzzyPublishedContent{

    width:100%;

    margin:0;

    padding:0;

    overflow:visible;

}

.kulzzyPublishedContent *{

    max-width:100%;

}

.kulzzyPublishedContent img{

    max-width:100%;

    height:auto;

}

.kulzzyPublishedContent video{

    max-width:100%;

    height:auto;

}

.kulzzyPublishedContent iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;

}

.kulzzyPublishedContent table{

    max-width:100%;

}


/* =========================================
   MORE PAGE LIST
========================================= */

#kulzzyMorePagesMenu{

    width:100%;

    margin:0;

    padding:0;

    display:flex;

    flex-direction:column;

    gap:10px;

}


/* =========================================
   MORE PAGE BUTTON
========================================= */

.kulzzyMorePageButton{

    width:100%;

    border:1px solid rgba(255,215,0,0.35);

    border-radius:12px;

    padding:14px 15px;

    background:#07152f;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s ease;

    -webkit-tap-highlight-color:transparent;

}

.kulzzyMorePageButton:hover{

    background:rgba(255,215,0,0.12);

    color:#ffd700;

}

.kulzzyMorePageButton.active{

    background:#ffd700;

    color:#07152f;

}


/* =========================================
   MORE PAGE CONTENT
========================================= */

#kulzzyMorePageContent{

    width:100%;

    margin:15px 0 0;

    padding:0;

}


.kulzzyMorePageContentBox{

    width:100%;

    margin:0;

    padding:0;

    background:transparent;

    color:inherit;

    border:none;

    border-radius:0;

    overflow:visible;

}


.kulzzyMorePageContentBox *{

    max-width:100%;

}

.kulzzyMorePageContentBox img{

    max-width:100%;

    height:auto;

}

.kulzzyMorePageContentBox video{

    max-width:100%;

    height:auto;

}

.kulzzyMorePageContentBox iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;

}

.kulzzyMorePageContentBox table{

    max-width:100%;

}


/* =========================================
   STATUS
========================================= */

.kulzzyStatus{

    width:100%;

    padding:15px;

    margin:0;

    background:#07152f;

    color:white;

    border:1px solid rgba(255,215,0,0.35);

    border-radius:12px;

    text-align:center;

    line-height:1.5;

}

.kulzzyStatus strong{

    color:#ffd700;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:360px){

    #kulzzyNav{

        width:calc(100% - 8px);

        top:5px;

        height:44px;

    }

    .kulzzyNavBtn{

        height:36px;

        font-size:9px;

    }

    #kulzzyContent{

        padding-top:62px;

    }

}


@media(min-width:361px) and (max-width:600px){

    .kulzzyNavBtn{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     FLOATING NAVIGATION
===================================== -->

<nav id="kulzzyNav">

    <button
        type="button"
        class="kulzzyNavBtn active"
        onclick="kulzzyOpen('home',this)">

        Home

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('request',this)">

        Request

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('wishes',this)">

        Wishes

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('market',this)">

        Market

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        onclick="kulzzyOpen('more',this)">

        More

    </button>

</nav>



<!-- =====================================
     CONTENT
===================================== -->

<div id="kulzzyContent">


    <!-- =================================
         HOME
    ================================= -->

    <section
        id="kulzzy-home"
        class="kulzzySection active">

        <div
            id="kulzzyPublished-home"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- =================================
         REQUEST
    ================================= -->

    <section
        id="kulzzy-request"
        class="kulzzySection">

        <div
            id="kulzzyPublished-request"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- =================================
         WISHES
    ================================= -->

    <section
        id="kulzzy-wishes"
        class="kulzzySection">

        <div
            id="kulzzyPublished-wishes"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- =================================
         MARKET
    ================================= -->

    <section
        id="kulzzy-market"
        class="kulzzySection">

        <div
            id="kulzzyPublished-market"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- =================================
         MORE
    ================================= -->

    <section
        id="kulzzy-more"
        class="kulzzySection">


        <!--
        MORE PAGE TITLES ARE SHOWN HERE.
        PAGE CONTENT OPENS ONLY AFTER CLICKING.
        -->

        <div
            id="kulzzyMorePagesMenu">
        </div>


        <div
            id="kulzzyMorePageContent">
        </div>


    </section>


</div>



<!-- =====================================
     FIREBASE
===================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


/* =========================================
   NORMAL SECTIONS
========================================= */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];


/* =========================================
   EXECUTE PUBLISHED SCRIPTS
========================================= */

function executePublishedScripts(container){

    const scripts =
        container.querySelectorAll("script");


    scripts.forEach(function(oldScript){

        const newScript =
            document.createElement("script");


        Array.from(
            oldScript.attributes
        ).forEach(function(attribute){

            newScript.setAttribute(
                attribute.name,
                attribute.value
            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(oldScript.parentNode){

            oldScript.parentNode.replaceChild(
                newScript,
                oldScript
            );

        }

    });

}


/* =========================================
   LOAD NORMAL SECTION
========================================= */

function loadNormalSection(section){

    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );


    if(!container){

        return;

    }


    const contentRef =
        ref(
            db,
            "kulzzyContent/" + section
        );


    onValue(

        contentRef,

        function(snapshot){

            container.innerHTML = "";


            if(!snapshot.exists()){

                return;

            }


            const data =
                snapshot.val();


            let html =
                data.html || "";


            /*
            -------------------------------------
            IF ADMIN PANEL SAVED BLOCKS
            -------------------------------------
            */

            if(
                !html.trim() &&
                data.blocks &&
                typeof data.blocks === "object"
            ){

                const blocks =
                    Object.keys(data.blocks)
                    .map(function(id){

                        return {

                            id:id,

                            html:
                                data.blocks[id].html || "",

                            order:
                                typeof data.blocks[id].order === "number"
                                ? data.blocks[id].order
                                : 0

                        };

                    })
                    .sort(function(a,b){

                        return a.order - b.order;

                    });


                html =
                    blocks
                    .map(function(block){

                        return block.html;

                    })
                    .join("\n\n");

            }


            if(!html.trim()){

                return;

            }


            const wrapper =
                document.createElement("div");


            wrapper.innerHTML =
                html;


            container.appendChild(
                wrapper
            );


            executePublishedScripts(
                wrapper
            );

        },

        function(error){

            console.error(
                "Firebase error:",
                section,
                error
            );

        }

    );

}


/* =========================================
   LOAD HOME / REQUEST / WISHES / MARKET
========================================= */

normalSections.forEach(function(section){

    loadNormalSection(section);

});


/* =========================================
   MORE PAGE SYSTEM
========================================= */

const morePagesRef =
    ref(
        db,
        "kulzzyMorePages"
    );


onValue(

    morePagesRef,

    function(snapshot){

        const menu =
            document.getElementById(
                "kulzzyMorePagesMenu"
            );


        const content =
            document.getElementById(
                "kulzzyMorePageContent"
            );


        if(!menu || !content){

            return;

        }


        /*
        CLEAR EVERYTHING
        */

        menu.innerHTML = "";

        content.innerHTML = "";


        /* =====================================
           NO PAGES
        ===================================== */

        if(!snapshot.exists()){

            const message =
                document.createElement("div");


            message.className =
                "kulzzyStatus";


            message.innerHTML =
                "<strong>No MORE pages available.</strong>";


            menu.appendChild(
                message
            );


            return;

        }


        const data =
            snapshot.val();


        /* =====================================
           CONVERT TO ARRAY
        ===================================== */

        const pages =
            Object.keys(data)
            .map(function(id){

                return {

                    id:id,

                    title:
                        data[id].title ||
                        "Untitled Page",

                    html:
                        data[id].html ||
                        "",

                    order:
                        typeof data[id].order === "number"
                        ? data[id].order
                        : 0

                };

            })
            .sort(function(a,b){

                return a.order - b.order;

            });


        /* =====================================
           CREATE PAGE BUTTONS ONLY
        ===================================== */

        pages.forEach(function(page){

            const button =
                document.createElement("button");


            button.type =
                "button";


            button.className =
                "kulzzyMorePageButton";


            button.textContent =
                page.title;


            /*
            CONTENT DOES NOT OPEN UNTIL
            THE USER CLICKS THE BUTTON.
            */

            button.addEventListener(
                "click",
                function(){

                    showMorePage(
                        page,
                        button
                    );

                }
            );


            menu.appendChild(
                button
            );

        });


    },

    function(error){

        console.error(
            "Firebase MORE page error:",
            error
        );


        const menu =
            document.getElementById(
                "kulzzyMorePagesMenu"
            );


        if(menu){

            menu.innerHTML = "";


            const errorBox =
                document.createElement("div");


            errorBox.className =
                "kulzzyStatus";


            errorBox.innerHTML =
                "<strong>MORE pages could not be loaded.</strong>";


            menu.appendChild(
                errorBox
            );

        }

    }

);


/* =========================================
   DISPLAY MORE PAGE AFTER CLICK
========================================= */

function showMorePage(page,button){

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    /*
    REMOVE ACTIVE STATE
    */

    document
    .querySelectorAll(
        ".kulzzyMorePageButton"
    )
    .forEach(function(item){

        item.classList.remove(
            "active"
        );

    });


    /*
    ACTIVATE CLICKED PAGE
    */

    if(button){

        button.classList.add(
            "active"
        );

    }


    /*
    CLEAR PREVIOUS CONTENT
    */

    content.innerHTML = "";


    /*
    CREATE CONTENT BOX
    */

    const pageBox =
        document.createElement("div");


    pageBox.className =
        "kulzzyMorePageContentBox";


    /*
    INSERT PAGE WRITE-UP
    */

    pageBox.innerHTML =
        page.html || "";


    content.appendChild(
        pageBox
    );


    /*
    RUN PAGE SCRIPTS
    */

    executePublishedScripts(
        pageBox
    );


    /*
    MOVE TO THE OPENED PAGE
    */

    setTimeout(function(){

        content.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    },50);

}


/* =========================================
   FIREBASE CONNECTION MESSAGE
========================================= */

console.log(
    "KULZZY RADIO: Firebase connected."
);

console.log(
    "KULZZY RADIO: Reading MORE pages from kulzzyMorePages."
);

</script>



<!-- =====================================
     NAVIGATION
===================================== -->

<script>

function kulzzyOpen(section,button){

    const sections =
        document.querySelectorAll(
            ".kulzzySection"
        );


    sections.forEach(function(item){

        item.classList.remove(
            "active"
        );

    });


    const buttons =
        document.querySelectorAll(
            ".kulzzyNavBtn"
        );


    buttons.forEach(function(item){

        item.classList.remove(
            "active"
        );

    });


    const selected =
        document.getElementById(
            "kulzzy-" + section
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    if(button){

        button.classList.add(
            "active"
        );

    }


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

</script>


</body>

</html>
